<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Sign in to your RoadRescue account for 24/7 tow truck and roadside assistance.">
    <meta name="theme-color" content="#101c2c">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Sign In | RoadRescue Tow Truck &amp; Roadside Assistance">
    <meta property="og:description" content="Sign in to your RoadRescue account to request roadside assistance, track tow trucks, and manage your account.">
    <meta property="og:url" content="https://roadrescue.example.com/login.html">
    <link rel="canonical" href="https://roadrescue.example.com/login.html">
    <link rel="icon" type="image/svg+xml" href="assets/images/icons/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
    <link rel="stylesheet" href="assets/css/themes.css">
    <link rel="stylesheet" href="assets/css/rtl.css">
    <link rel="stylesheet" href="assets/css/pages.css">
    <link rel="stylesheet" href="assets/css/auth.css">
    <title>Sign In | RoadRescue Tow Truck &amp; Roadside Assistance</title>
    <script src="assets/js/theme.js"></script>
    <script src="assets/js/rtl.js"></script>
    <script src="assets/js/auth.js" defer></script>
  </head>
  <body class="login-page">
    <!-- Top-Right Preferences (RTL & Light/Dark Theme) -->
    <aside class="auth-floating-controls" aria-label="Display and language preferences">
      <button class="auth-control-btn" type="button" data-rtl-toggle aria-label="Enable right-to-left layout" aria-pressed="false">RTL</button>
      <button class="auth-control-btn auth-control-btn--theme" type="button" data-theme-toggle aria-label="Switch to dark theme" aria-pressed="false">
        <i class="bi bi-moon" aria-hidden="true"></i>
      </button>
    </aside>

    <main id="main-content">
      <div class="login-viewport">
        <div class="login-card-container">
          <section class="login-card" aria-labelledby="login-brand-title">
            <!-- Brand Logo & Header -->
            <header class="login-card__header">
              <a href="index.html" class="login-card__brand-link" aria-label="RoadRescue Home">
                <img class="login-brand__logo" src="assets/images/icons/logo-icon.png" alt="RoadRescue Logo" width="44" height="44">
                <span class="login-brand__name" id="login-brand-title">Road<strong>Rescue</strong></span>
              </a>
              <p class="login-card__subtitle">Roadside Assistance Portal Sign In</p>
            </header>

            <!-- Login Form -->
            <form class="auth-form login-form" data-auth-form="login" novalidate>
              <!-- Business Email Field -->
              <div class="form-field">
                <label for="login-email">Business Email</label>
                <input
                  class="form-control"
                  id="login-email"
                  name="email"
                  type="email"
                  value=""
                  autocomplete="off"
                  placeholder="e.g. driver@roadrescue.com"
                  required
                  maxlength="254"
                >
              </div>

              <!-- Password Field with Toggle & Forgot Password Link -->
              <div class="form-field">
                <div class="auth-field__row">
                  <label for="login-password">Password</label>
                  <a class="auth-forgot-link" href="forgot-password.html">Forgot Password?</a>
                </div>
                <div class="password-input-group">
                  <input
                    class="form-control password-input-field"
                    id="login-password"
                    name="password"
                    type="password"
                    value=""
                    autocomplete="off"
                    placeholder="e.g. Enter your account password"
                    required
                  >
                  <button
                    class="password-toggle-btn"
                    type="button"
                    data-password-toggle
                    aria-controls="login-password"
                    aria-pressed="false"
                    aria-label="Show password"
                  >
                    <i class="bi bi-eye" aria-hidden="true"></i>
                  </button>
                </div>
              </div>

              <!-- Remember Me Checkbox -->
              <label class="login-remember" for="login-remember">
                <input id="login-remember" name="rememberBrowser" type="checkbox" checked>
                <span class="login-remember__box" aria-hidden="true"><i class="bi bi-check-lg"></i></span>
                <span class="login-remember__text">Remember this browser</span>
              </label>

              <!-- Quick Sign In (Google & Apple) -->
              <div class="login-provider-options" aria-label="Third-party sign-in options">
                <button class="button button--secondary login-provider-button" type="button" data-provider-login="Google">
                  <svg class="login-provider-icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
                    <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>
                    <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.34 24 12 24z"/>
                    <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.98 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/>
                    <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.34 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
                  </svg>
                  <span>Sign in with Google</span>
                </button>
                <button class="button button--secondary login-provider-button" type="button" data-provider-login="Apple">
                  <svg class="login-provider-icon login-provider-icon--apple" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                    <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.38c.62-.75 1.04-1.8 0.92-2.85-.9.04-1.99.6-2.63 1.35-.57.66-1.06 1.73-.93 2.75 1 .08 2.02-.5 2.64-1.25z"/>
                  </svg>
                  <span>Sign in with Apple</span>
                </button>
              </div>

              <!-- Divider -->
              <div class="login-card__divider"><span>OR CONTINUE WITH EMAIL</span></div>

              <!-- Submit Button -->
              <button class="button button--primary w-100 login-card__submit" type="submit">
                <span>Sign In</span>
                <i class="bi bi-arrow-right icon-directional" aria-hidden="true"></i>
              </button>

              <!-- Status / Validation Feedback -->
              <p class="auth-status" data-auth-status role="status" aria-live="polite"></p>
            </form>

            <!-- Sign Up Link -->
            <footer class="login-card__signup">
              <span>Don’t have an account?</span>
              <a href="register.html" class="login-card__signup-link">Sign Up Free</a>
            </footer>
          </section>
        </div>
      </div>
    </main>
  </body>
</html>
